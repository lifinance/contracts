# This file ensures that we get informed when dependencies of actions (e.g. other actions) are outdated and can be updated
# Dependabot will even create a PR and update the files automatically
# More info here: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/' # will check in ./.github/workflows with this setting
    schedule:
      # Check for updates to GitHub Actions every week
      interval: 'weekly'

  # npm dependencies resolved through bun.lock. Minor and patch bumps arrive as one
  # grouped PR per month; major bumps still get their own PR each.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # oxfmt is pre-1.0, so a minor bump can change its output; it gets its own PR
      # so a reformat is not mixed in with unrelated bumps.
      oxfmt:
        patterns:
          - 'oxfmt'
      bun-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    # Held back: @typechain/ethers-v5 11 breaks the published lifi-contract-types
    # API, and TypeScript 7 drops the compiler API the node-runtime and placement
    # fences use. prettier and prettier-plugin-solidity format only the audited
    # src/ contracts and are pinned so their output never changes; any update can
    # reformat src/ and change audit source hashes, so none is proposed.
    ignore:
      - dependency-name: '@typechain/ethers-v5'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prettier'
      - dependency-name: 'prettier-plugin-solidity'
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
