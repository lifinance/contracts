# Verify Emergency Pause Readiness
# - Read-only companion to the emergency-pause workflow: verifies the pause CAN fire
#   on every production diamond, without firing it. Runs script/utils/verifyEmergencyPauseReadinessGitHub.sh.
# - Secret check (offline): the address derived from PRIV_KEY_PAUSER_WALLET matches the
#   configured pauser in config/global.json (EVM + Tron). Fail-fast.
# - Pauser check (on-chain): each production LiFiDiamond's registered pauserWallet() equals
#   that derived address, read via the real `universalCast "call"` (EVM + Tron).
# - Governance checks (on-chain, the unpause path), reported as two separate checks: (a)
#   LiFiTimelockController.diamond() matches the deploy-log diamond, and (b) the Safe holds
#   TIMELOCK_ADMIN_ROLE (so it can execute unpauseDiamond()). Skipped on testnets/Tron and on any
#   network with no deployed timelock or configured Safe.
# - Hexagate PAT check: six checks on the lifi-hexagate-pauser PAT that Hexagate uses to fire
#   workflow_dispatch on this repo — (1) HEXAGATE_PAUSER_PAT secret is configured, (2) PAT
#   format is valid (ghp_* classic PAT prefix only), (3) SSO authorized for
#   lifinance org, (4) not expired/revoked, (5) has push (write) access and workflow/repo scope,
#   (6) token owner is an active member of the lifinance/diamondpauser gate team. Fails (not
#   skips) when HEXAGATE_PAUSER_PAT is unset. No workflow is triggered by these checks.
# - Bot PAT check: runs the emergency-pause gate's own lookup (gh api on the diamondpauser team
#   membership of a known active member) with GIT_ACTIONS_BOT_PAT_CLASSIC, the token the gate
#   uses. Passes only on state "active" with more than 8 days before the token expires; anything
#   else fails, and the log names the cause (expired/revoked token, SSO not authorized, missing
#   read:org, GitHub API down after a retry, expiry close, or the known member left the team).
#   Never skipped.
# - Funds check (scheduled/manual only): script/utils/checkPauserFunds.sh audits whether the pauser
#   wallet can afford pauseDiamond() on every production EVM chain, and reports the TOP-UP needed to
#   reach OK — in the chain's native/gas asset, or in its fee token on chains with no native currency
#   (e.g. tempo pays gas in pathUSD). A CRITICAL network (cannot fund a single pause) — or a fully-blind
#   sweep where every network errors — fails the run and shows as a red cross in the consolidated Slack status.
#   Skipped on PRs: funding is live operational state, independent of the code under review.
# - GitHub secrets are write-only and on-chain pauser drift is invisible until the pause
#   is triggered; this turns both latent failures into a scheduled, loud one.
# - Slack: ONE consolidated status (a green check / red cross / fast-forward per check, with a link
#   to the run) is posted on every WEEKLY SCHEDULED run and every MANUAL (workflow_dispatch) run, pass
#   or fail — so a green week is confirmed, a silently-broken cron shows up as a missing message, and a
#   manual run always reports back. PR runs post nothing.
# - Does NOT cover the pause WRITE/propose path (EXSC-368) - this is read-only.
# - Triggers: weekly cron (Thu 07:00 UTC ≈ 09:00 CEST / 08:00 CET) + workflow_dispatch (manual) + pull_request limited to the
#   paths below (config/global.json, config/networks.json, the involved scripts, this workflow,
#   and the shared foundry setup action + .foundry-version its toolchain comes from).
# - Known limitations: needs RPCs (MongoDB) + deploy logs. Transient RPC errors are retried before
#   failing — the readiness checks via rpcCallWithRetry, the funds path via estimatePauseCost +
#   balance retries — and the funds check FAILS (rather than false-greening) if EVERY network errors.

name: Verify Emergency Pause Readiness

on:
  schedule:
    - cron: '0 7 * * 4' # 07:00 UTC every Thursday (≈09:00 CEST summer / 08:00 CET winter — cron is UTC, no DST)
  workflow_dispatch: # manual trigger (e.g. after rotating the key or before a drill)
  pull_request:
    paths:
      # Catch a bad pauser/governance config edit, or a change to a script this check runs.
      # (The funds check is skipped on PRs, so only the readiness check's inputs are covered here.)
      - config/global.json # pauser wallet (EVM + Tron) — the secret check compares against this
      - config/networks.json # governance safeAddress + the production network list / types
      - script/utils/verifyEmergencyPauseReadinessGitHub.sh
      - script/universalCast.sh
      - script/helperFunctions.sh
      - .github/workflows/verifyEmergencyPauseReadiness.yml
      - .github/actions/setup-foundry/**
      - .foundry-version

permissions:
  contents: read # required to checkout the repository and read config/deploy logs
  actions: read # required to resolve this job's URL (jobs API) for the Slack deep-link

jobs:
  verify-emergency-pause-readiness:
    # Upstream-only: this readiness/funds/Slack check needs lifinance/contracts' secrets,
    # RPCs and production diamonds. On forks (e.g. contracts-tron) the guard is false, so the
    # job is skipped (neutral, not failed) across schedule / workflow_dispatch / pull_request.
    if: ${{ github.repository == 'lifinance/contracts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only check; no git push/tag/submodule operations

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - name: Fetch RPC endpoints from MongoDB
        uses: ./.github/actions/fetch-rpcs
        with:
          mongodb-uri: ${{ secrets.MONGODB_URI }}

      # continue-on-error so the funds check below still runs even if this fails; the final
      # "Fail if any readiness check failed" step restores the red check.
      - name: Verify emergency pause readiness
        id: readiness
        continue-on-error: true
        run: bash script/utils/verifyEmergencyPauseReadinessGitHub.sh
        env:
          PRIVATE_KEY_PAUSER_WALLET: ${{ secrets.PRIV_KEY_PAUSER_WALLET }}
          HEXAGATE_PAUSER_PAT: ${{ secrets.HEXAGATE_PAUSER_PAT }} # lifi-hexagate-pauser PAT; fails (not skips) if unset

      # Same lookup, same token as the diamondEmergencyPause.yml membership gate, for a member
      # known to be active. A 404 is ambiguous (not a member, or the token cannot see the team),
      # so on a 404 the team itself is read to name the cause. The check runs weekly, so it
      # also fails while the token has MIN_DAYS_LEFT days or fewer before it expires.
      - name: Verify bot PAT can read diamondpauser membership
        id: bot_pat
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GIT_ACTIONS_BOT_PAT_CLASSIC }}
          KNOWN_MEMBER: lifi-hexagate-pauser # the account Hexagate dispatches with
          MIN_DAYS_LEFT: 8
        run: |
          set -euo pipefail
          fail() {
            echo -e "\033[31m$1\033[0m"
            exit 1
          }
          [[ -n "$GH_TOKEN" ]] || fail "GIT_ACTIONS_BOT_PAT_CLASSIC is not set: the pause gate rejects every dispatch"
          HEADERS=$(mktemp)
          BODY=$(mktemp)
          header() {
            grep -i "^$1:" "$HEADERS" | tail -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true
          }
          isTransient() {
            [[ "$STATUS" == "000" || "$STATUS" == 5* || "$STATUS" == "429" ]] \
              || [[ "$STATUS" == "403" && "$(header x-ratelimit-remaining)" == "0" ]]
          }
          # Sets STATUS; retries once on a network error, a 5xx or a rate limit
          apiGet() {
            for ATTEMPT in 1 2; do
              STATUS=$(curl -sS -o "$BODY" -D "$HEADERS" -w '%{http_code}' \
                -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/$1") || STATUS="000"
              isTransient || return 0
              if [[ "$ATTEMPT" == "1" ]]; then
                echo "GET $1 returned HTTP $STATUS, retrying in 15s"
                sleep 15
              fi
            done
          }
          # Names the cause for any answer that is not a readable team or membership
          tokenCause() {
            if isTransient; then
              echo "GitHub API unavailable (HTTP $STATUS) after a retry: readiness unknown, re-run this workflow"
            elif [[ "$STATUS" == "401" ]]; then
              echo "GIT_ACTIONS_BOT_PAT_CLASSIC is expired or revoked (HTTP 401): rotate it, the pause gate rejects every dispatch"
            elif [[ "$STATUS" == "403" && "$(header x-github-sso)" == required* ]]; then
              echo "GIT_ACTIONS_BOT_PAT_CLASSIC is not SSO-authorized for lifinance (HTTP 403): re-authorize it at github.com/settings/tokens as its owner"
            else
              echo "GIT_ACTIONS_BOT_PAT_CLASSIC cannot read the diamondpauser team (HTTP $STATUS, likely missing read:org): the pause gate rejects every dispatch"
            fi
          }
          MEMBER_CAUSE="$KNOWN_MEMBER is not an active diamondpauser member, so Hexagate dispatches are rejected: re-add it to the team or accept its pending invite"

          apiGet "orgs/lifinance/teams/diamondpauser/memberships/$KNOWN_MEMBER"
          if [[ "$STATUS" == "404" ]]; then
            apiGet "orgs/lifinance/teams/diamondpauser"
            [[ "$STATUS" == "200" ]] && fail "$MEMBER_CAUSE"
            fail "$(tokenCause)"
          fi
          [[ "$STATUS" == "200" ]] || fail "$(tokenCause)"
          STATE=$(jq -r '.state // empty' "$BODY")
          [[ "$STATE" == "active" ]] || fail "$MEMBER_CAUSE (state: ${STATE:-unknown})"

          EXPIRY=$(header github-authentication-token-expiration)
          if [[ -n "$EXPIRY" ]]; then
            EXPIRY_TS=$(date -u -d "$EXPIRY" +%s) || fail "Cannot parse the token expiry header: '$EXPIRY'"
            DAYS_LEFT=$(((EXPIRY_TS - $(date -u +%s)) / 86400))
            if ((DAYS_LEFT <= MIN_DAYS_LEFT)); then
              fail "GIT_ACTIONS_BOT_PAT_CLASSIC expires $EXPIRY ($DAYS_LEFT days left): rotate it before the next weekly run"
            fi
          fi
          echo -e "\033[32mBot PAT reads diamondpauser membership: $KNOWN_MEMBER is active (token expiry: ${EXPIRY:-none})\033[0m"

      # Funding is live operational state (independent of the code in a PR), so this runs on
      # scheduled / manual runs only. checkPauserFunds.sh is read-only and needs no pauser
      # secret (it reads the CONFIGURED pauser's balance, not the key); it exits non-zero when
      # any production chain is CRITICAL (cannot afford a single pauseDiamond()). RPC endpoints
      # come from the MongoDB fetch step above (ETH_NODE_URI_* in the environment).
      - name: Check pauser wallet funds
        id: funds
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: bash script/utils/checkPauserFunds.sh

      # Restore the red check that continue-on-error suppressed: fail the job if any check
      # failed. On PR runs the funds step is skipped (outcome 'skipped'), so the readiness and
      # bot PAT checks gate PRs.
      - name: Fail if any readiness check failed
        if: ${{ always() }}
        env:
          BOT_PAT: ${{ steps.bot_pat.outcome }}
        run: |
          if [[ "${{ steps.readiness.outcome }}" == "failure" || "${{ steps.funds.outcome }}" == "failure" || "$BOT_PAT" == "failure" ]]; then
            echo "Emergency pause readiness FAILED (readiness=${{ steps.readiness.outcome }}, bot_pat=$BOT_PAT, funds=${{ steps.funds.outcome }})."
            exit 1
          fi

      # Build ONE consolidated Slack message — a bullet per check (green check = pass, red cross =
      # fail, fast-forward = not reached) plus a link to this run — and post it once below. Posted on
      # every scheduled run AND every manual (workflow_dispatch) run, pass or fail: a healthy week is
      # confirmed, a silently-broken cron shows up as a MISSING message, and a manual drill/check always
      # reports a result in-channel. PR runs never reach here. Runs unless the job was cancelled, so it
      # still reports after the "Fail if any readiness check failed" gate.
      - name: Compose readiness status message
        id: status_msg
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_PAT: ${{ steps.bot_pat.outcome }}
        run: |
          # Deep-link straight to THIS job (…/runs/<run>/job/<job_id>) so the Slack link lands on the
          # job (and its failing step) rather than the run overview. github.job is the job key, not the
          # numeric id the URL needs, so resolve the job's html_url via the jobs API; fall back to the
          # run overview if it can't be read.
          RUN_OVERVIEW="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_URL=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.name == "${{ github.job }}") | .html_url][0] // .jobs[0].html_url' 2>/dev/null)
          RUN_URL="${RUN_URL:-$RUN_OVERVIEW}"
          # Per-check emoji: pass/success -> check; skipped (e.g. the on-chain checks not reached
          # because the secret check fail-fasted) -> fast-forward; anything else (failure / missing
          # output) -> cross.
          icon() {
            case "$1" in
              pass | success) printf ':white_check_mark:' ;;
              skipped) printf ':fast_forward:' ;;
              *) printf ':x:' ;;
            esac
          }
          # Per-check results published by verifyEmergencyPauseReadinessGitHub.sh; funds is its own step.
          SECRET="${{ steps.readiness.outputs.secret }}"
          PAUSER="${{ steps.readiness.outputs.pauser }}"
          TIMELOCK_DIAMOND="${{ steps.readiness.outputs.timelockDiamond }}"
          SAFE_ROLE="${{ steps.readiness.outputs.safeAdminRole }}"
          HEXAGATE_PAT="${{ steps.readiness.outputs.hexagatePat }}"
          # Hexagate PAT sub-checks (rendered as child bullets under the parent)
          HEX_SECRET="${{ steps.readiness.outputs.hexagatePatSecret }}"
          HEX_FORMAT="${{ steps.readiness.outputs.hexagatePatFormat }}"
          HEX_SSO="${{ steps.readiness.outputs.hexagatePatSso }}"
          HEX_VALIDITY="${{ steps.readiness.outputs.hexagatePatValidity }}"
          HEX_DISPATCH="${{ steps.readiness.outputs.hexagatePatDispatch }}"
          HEX_TEAM="${{ steps.readiness.outputs.hexagatePatTeam }}"
          FUNDS="${{ steps.funds.outcome }}"
          if [[ "$SECRET" == "pass" && "$PAUSER" == "pass" && "$TIMELOCK_DIAMOND" == "pass" && "$SAFE_ROLE" == "pass" && "$HEXAGATE_PAT" == "pass" && "$BOT_PAT" == "success" && "$FUNDS" == "success" ]]; then
            HEADER=":white_check_mark: *Emergency pause readiness — all checks passed*"
          else
            HEADER=":rotating_light: *Emergency pause readiness — ACTION NEEDED*"
          fi
          # Real newlines here; toJSON in the Slack payload below encodes them as \n for the webhook.
          # The Hexagate PAT entry is a parent bullet with six indented child bullets beneath it.
          TEXT=$(printf '%s\n• %s Pauser secret matches the configured pauser wallet (EVM + Tron)\n• %s On-chain pauserWallet() matches the configured pauser on every production diamond\n• %s Timelock controls the right diamond — LiFiTimelockController.diamond() matches the deployed LiFiDiamond\n• %s Safe holds TIMELOCK_ADMIN_ROLE on the timelock (can execute unpauseDiamond())\n• %s Hexagate PAT (lifi-hexagate-pauser)\n    - %s HEXAGATE_PAUSER_PAT secret is configured\n    - %s PAT format is valid (ghp_* classic PAT)\n    - %s No SSO block on lifinance org access\n    - %s PAT active (not expired/revoked)\n    - %s Can trigger workflow_dispatch (push access + scope)\n    - %s Token owner is in the diamondpauser gate team\n• %s Bot PAT (GIT_ACTIONS_BOT_PAT_CLASSIC) can read diamondpauser membership for the pause gate\n• %s Every production pauser wallet can afford pauseDiamond()\n<%s|View workflow run>' \
            "$HEADER" \
            "$(icon "$SECRET")" "$(icon "$PAUSER")" "$(icon "$TIMELOCK_DIAMOND")" "$(icon "$SAFE_ROLE")" \
            "$(icon "$HEXAGATE_PAT")" "$(icon "$HEX_SECRET")" "$(icon "$HEX_FORMAT")" "$(icon "$HEX_SSO")" "$(icon "$HEX_VALIDITY")" "$(icon "$HEX_DISPATCH")" "$(icon "$HEX_TEAM")" \
            "$(icon "$BOT_PAT")" "$(icon "$FUNDS")" "$RUN_URL")
          {
            echo "text<<SLACK_EOF"
            echo "$TEXT"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack with readiness status
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(steps.status_msg.outputs.text) }}
            }
