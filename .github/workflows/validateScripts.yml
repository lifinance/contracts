# Validate Scripts (EXSC-331)
# - Static validation (no script execution) of TS scripts under script/
# - Type check: `tsc-files --noEmit` over changed TS files under script/ —
#   removing a used import (TS2304) or a dependency a script imports (TS2307)
#   fails fast instead of breaking at runtime
# - Import resolution: when package.json / bun.lock / tsconfig.json change,
#   every bare import in script TS files must resolve to a package declared
#   in package.json (catches "dependency removed while still imported"
#   even when no .ts file was touched)
# - Path-gated: the heavy job runs only when scripts or dependency manifests
#   change. A `validate-scripts-required` aggregator job always reports a
#   final status so this workflow can be registered as a required check on
#   `main` branch protection (see .agents/rules/500-github-actions.md)
# - TypeChain types are generated before the type check because several
#   scripts import generated typechain/ types (requires foundry + forge build)
# - Local counterpart: the .husky/pre-push hook runs the same validator for
#   fast feedback; this workflow is the enforcement backstop since git hooks
#   can be bypassed with --no-verify
# - Immutable registry: verify-immutable-registry.ts checks
#   script/deploy/resources/immutableRegistry.json against the immutables
#   declared in src/. Warn-only on the authoring gap until --strict flips on;
#   see the step's own comment for what it does and does not run on

name: Validate Scripts
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read # required to fetch repository contents
  pull-requests: read # required by dorny/paths-filter to read changed files on PRs

# Cancel superseded in-progress runs on the same PR (force-push / rapid commits)
# so stale script-validation runs (which build forge + typechain) stop burning
# runner minutes. Keyed per workflow, per event type, and per PR (falling back to
# ref). Scoping by event_name keeps unrelated branches and event types in
# separate groups, so a manual workflow_dispatch run keeps its own concurrency
# lane instead of competing with PR runs. cancel-in-progress is scoped to
# pull_request events so manual workflow_dispatch runs always complete and keep
# their signal.
concurrency:
  group: validate-scripts-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    # Determines whether files that can influence script validity were touched.
    # Always runs (cheap) so the downstream validate-scripts-required can report status.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      immutables: ${{ steps.filter.outputs.immutables }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          # Read-only job — no authenticated git operations after checkout
          persist-credentials: false
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            scripts:
              - 'script/**/*.ts'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/validateScripts.yml'
              - '.github/actions/setup-foundry/**'
              - '.foundry-version'
            # The registry accounts for immutables declared in src/, so a PR
            # adding a facet has to be able to run the gate without also
            # touching script tooling.
            immutables:
              - 'src/**/*.sol'
              - 'script/deploy/immutables/**/*.ts'
              - 'script/deploy/resources/immutableRegistry.json'
              - 'script/deploy/resources/deployRequirements.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/validateScripts.yml'

  validate-scripts:
    # Runs on PRs (once out of draft) and on workflow_dispatch.
    # For non-PR events `github.event.pull_request` is null, so the draft check
    # is gated behind an event-name guard.
    needs: detect-changes
    if: >-
      ${{
        needs.detect-changes.outputs.scripts == 'true' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.draft == false)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          # Full history so the validator can compute the merge-base with the
          # PR base branch; submodules for `forge build src` (TypeChain input)
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dev dependencies
        run: bun install

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - name: Install forge Dependencies
        run: forge install

      - name: Generate TypeChain types
        # Several scripts (e.g. script/demoScripts/**, script/deploy/tron/**)
        # import generated typechain/ types; without them the type check would
        # fail with false TS2307 errors
        run: bun typechain:incremental

      - name: Validate scripts
        shell: bash
        run: |
          ##### Diff against the PR base branch (merge-base is computed inside
          ##### the validator); workflow_dispatch has no base ref, so the
          ##### validator falls back to the merge-base with origin/main
          if [[ -n "$BASE_REF" ]]; then
            bunx tsx ./script/utils/validateScripts.ts --base "origin/$BASE_REF"
          else
            bunx tsx ./script/utils/validateScripts.ts
          fi
        env:
          BASE_REF: ${{ github.base_ref }}

  verify-immutable-registry:
    # Separate from `validate-scripts` because the gate reads Solidity SOURCE and
    # two JSON files — it needs neither the forge build nor TypeChain, so gating
    # it on src/** costs a bun install rather than a full compile.
    needs: detect-changes
    if: >-
      ${{
        needs.detect-changes.outputs.immutables == 'true' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.draft == false)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.0.1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify immutable registry
        shell: bash
        run: |
          ##### Warn-only while WP-2.3's authoring pass runs: an immutable with no
          ##### registry entry is a warning, not a failure. It still exits non-zero
          ##### for anything the registry gets WRONG — a link to a config key that
          ##### does not exist, an entry for an immutable no contract declares, an
          ##### exemption with no reason — and for any declaration the enumerator
          ##### could not read, since an immutable it cannot see is one the registry
          ##### is never asked to account for.
          ##### Still skipped on draft PRs, and the workflow has no push trigger;
          ##### the ready_for_review trigger re-runs it against final HEAD.
          ##### Flip to --strict once every immutable is authored (EXSC-869 part ii).
          bunx tsx ./script/deploy/immutables/verify-immutable-registry.ts

  validate-scripts-required:
    # Aggregator job for branch protection. Reports green when the heavy job
    # either succeeded or was skipped because no relevant files changed.
    # Register THIS job (not `validate-scripts`) as the required status check on `main`.
    needs: [detect-changes, validate-scripts, verify-immutable-registry]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate upstream result
        # Validate `detect-changes` succeeded first. If it failed, `validate-scripts`
        # would be `skipped` due to the dependency failure — and treating that
        # `skipped` as success would mask the infra failure from branch protection.
        run: |
          set -euo pipefail
          detect_result="${{ needs.detect-changes.result }}"
          validate_result="${{ needs.validate-scripts.result }}"
          registry_result="${{ needs.verify-immutable-registry.result }}"
          if [[ "$detect_result" != "success" ]]; then
            echo -e "\033[31mvalidate-scripts-required FAILED (detect-changes=$detect_result)\033[0m" >&2
            exit 1
          fi
          ##### Every gated job has to be named here. One left out is reported green
          ##### by this aggregator no matter what it did, which is the failure mode
          ##### the aggregator exists to prevent.
          for job in "validate-scripts=$validate_result" "verify-immutable-registry=$registry_result"; do
            result="${job#*=}"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo -e "\033[31mvalidate-scripts-required FAILED ($job)\033[0m" >&2
              exit 1
            fi
          done
          echo -e "\033[32mvalidate-scripts-required OK (validate-scripts=$validate_result, verify-immutable-registry=$registry_result)\033[0m"
          exit 0
