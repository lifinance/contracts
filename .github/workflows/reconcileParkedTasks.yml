# Reconcile Deferred Diamond-Cleanup Queue
# - Reconciles open parked facet-removal tasks (deferred diamond-cleanup queue) against on-chain
#   truth: a facet no longer routed by the loupe is terminal (executed if its own proposal executed,
#   else superseded); a proposed task whose proposal reverted while the facet is still present is
#   re-queued. See script/deploy/safe/reconcile-parked-tasks.ts + docs/DeferredDiamondCleanupQueue.md §7/§8.
# - TTL backstop: any open task older than the TTL (default 60d) is posted to the
#   github-ci-notifications Slack channel so a cold network that never gets another cut is never
#   silently orphaned (§8). A separate alert carries what the sweep could not resolve: tasks whose
#   network is outside the active set in config/networks.json (awaiting a cancel) and any
#   network/environment group that errored. Only the latter fails the run.
# - Runs with --yes so transitions are applied and the alert is sent. Transitions touch only the
#   un-gated MONGODB_URI queue (status flips), never on-chain state or the signing store.
# - Per-network isolation: an unreachable chain is logged and skipped, the remaining networks and the
#   TTL alert still run, and every skipped network is named in a Slack alert rather than lost.
# - A task whose network is not active in networks.json is reported, never cancelled here: cancelling
#   requires an operator naming one network (--network X --cancel-deprecated --yes), because
#   networks.json is temporarily narrowed for pause rehearsals and this job runs unattended.
# - Loupe-primary: SC_MONGODB_URI (the signing store) is NOT reachable from GitHub Actions (no tunnel),
#   so the job runs in loupe-only mode — a gone facet is marked superseded (executed vs superseded is
#   an audit label only) and revert-detection is skipped; run locally with tunnel access for the full
#   state machine. RPCs are fetched from MongoDB (fallback: public RPCs from networks.json).
# - Triggers: weekly cron (Mon 08:00 UTC) + workflow_dispatch (manual). Upstream-only (skips on forks).
# - Known limitations: needs MONGODB_URI (queue + RPCs) and, because this run applies, a populated
#   WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS — a run that has an alert to post but no webhook fails
#   instead of staying green while the backstop alert is dropped. Slack delivery also requires CI
#   to be set, so a local run of the same script logs the alert instead of posting it.

name: Reconcile Deferred Diamond-Cleanup Queue

on:
  schedule:
    - cron: '17 8 * * 1' # 08:17 UTC every Monday (off-minute to avoid the fleet-wide :00 spike)
  workflow_dispatch: # manual trigger (e.g. after a large deprecation or backstop sweep)

# Default-deny at the workflow level; grant only what the job needs.
permissions: {}

jobs:
  reconcile-parked-tasks:
    # Upstream-only: needs lifinance/contracts' secrets, RPCs and production diamonds. On forks the
    # guard is false, so the job is skipped (neutral, not failed).
    if: ${{ github.repository == 'lifinance/contracts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # required to checkout the repo and read config/deploy logs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive # forge build needs lib/ for the selector-union artifacts
          persist-credentials: false # read-only reconcile; no git push/tag operations

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      # The reopen gate resolves removability through the removal engine, whose
      # selector unions come from out/ artifacts — without them every unlogged
      # address is "unverifiable" and the false-resolution reopen never fires.
      - name: Build contracts (generate Foundry artifacts)
        run: forge build --skip script --skip test --skip Base --skip Test --skip '*.t.sol'

      - name: Fetch RPC endpoints from MongoDB
        run: |
          # Populate .env with prioritized RPCs (falls back to public RPCs from networks.json).
          bun fetch-rpcs
          # Forward only ETH_NODE_URI_* into the job env, masking each URL (may carry an API key)
          # so it is redacted from all subsequent log output.
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" =~ ^ETH_NODE_URI_ ]]; then
              value="${line#*=}"
              if [[ "$value" == \"*\" ]]; then value="${value:1:-1}"; fi
              if [[ "$value" == \'*\' ]]; then value="${value:1:-1}"; fi
              echo "::add-mask::$value"
              echo "${line%%=*}=$value" >> "$GITHUB_ENV"
            fi
          done < ".env"
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Reconcile parked tasks + TTL alert
        run: bunx tsx script/deploy/safe/reconcile-parked-tasks.ts --yes
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }} # un-gated deferred-cleanup queue + RPC fallback
          # Script reads WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS (local .env convention); the GH
          # secret follows the repo's SLACK_WEBHOOK_* naming — bridge one to the other.
          WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS: ${{ secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS }} # TTL alert (required for this applied run)

      # A silently-broken cron defeats the cold-network backstop — surface run failures to Slack.
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS }}
          webhook-type: incoming-webhook
          # Surface a rejected/expired webhook instead of reporting a delivery that never happened.
          errors: true
          payload: |
            {
              "text": ":warning: reconcile-parked-tasks run failed: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}>"
            }
