# Mint Build Attestations
# - Rebuilds every versioned contract with `--ast` and regenerates
#   script/deploy/resources/buildAttestations.json, the manifest the sign-time
#   codehash gate looks up instead of recompiling.
# - On pull requests: fails when the committed manifest is not what the checkout
#   produces. A stale manifest is one the attestation no longer covers.
# - On push to main: the same check, then mints a build-provenance attestation
#   over the committed bytes via Sigstore. That attestation is what makes the
#   committed file first-party evidence rather than a transcription.
# - Deliberately NOT path-filtered. A path filter turns this into a job that
#   skips, and a skipped job reports success — which is exactly how a gate goes
#   quiet without anyone noticing. The build is the cost of never having to ask
#   whether the check ran.
# - Known limitation: only the `default` profile is minted today. The manifest
#   records its own `coveredProfiles`, so a reader must treat code built under
#   any other toolchain (notably zksync) as unverifiable rather than unattested.

name: Mint Build Attestations

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      # SPIKE-ONLY (EXSC-952): proves the mint+verify round trip on a branch.
      # Revert before review.
      - claude/sleepy-easley-d85c04
  workflow_dispatch:

# Default-deny at the workflow level; grant only what the job needs.
permissions: {}

concurrency:
  group: mint-attestations-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # required to fetch repository contents
      id-token: write # required by attest-build-provenance to obtain the OIDC token it signs with
      attestations: write # required to write the attestation to this repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dev dependencies
        run: bun install --frozen-lockfile

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry
        with:
          cache-key-suffix: mint-attestations

      - name: Verify the committed manifest matches this checkout
        shell: bash
        run: |
          set -euo pipefail
          ##### `--check` writes nothing and exits 1 on any byte of drift.
          ##### The attestation below binds a digest of the committed bytes, so
          ##### minting a manifest that differs from the reviewed one would sign
          ##### something no human ever read.
          if ! bun attestations:check; then
            echo -e "\033[31mThe committed manifest is not what this checkout builds.\033[0m"
            echo -e "\033[31mRun 'bun attestations:mint' and commit the result.\033[0m"
            exit 1
          fi
          echo -e "\033[32mManifest matches the build.\033[0m"

      - name: Mint the attestation
        ##### Only on main: an attestation names the workflow identity and the
        ##### ref it ran on, and one minted from a branch would vouch for code
        ##### that never passed review.
        # SPIKE-ONLY (EXSC-952): the ref gate is widened to this branch so one
        # attestation can actually be minted and verified. Revert before review.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/sleepy-easley-d85c04')
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: script/deploy/resources/buildAttestations.json

      - name: Report the mint
        if: steps.attest.outcome == 'success'
        env:
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        shell: bash
        run: |
          set -euo pipefail
          echo -e "\033[32mMinted: $ATTESTATION_URL\033[0m"
          ##### Printed so the digest a later verify must reproduce is visible in
          ##### the log of the run that signed it.
          sha256sum script/deploy/resources/buildAttestations.json
