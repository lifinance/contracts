# Markdownlint
# - lints EVERY Markdown file in the repo against .markdownlint-cli2.jsonc (excluding that
#   config's own `ignores`), not just the files changed in the PR
# - runs the repo's own pinned markdownlint-cli2 via `bun lint:md`, so CI and a local
#   `bun lint:md` execute byte-identical engine + config. The previous
#   DavidAnson/markdownlint-cli2-action@v18 bundled markdownlint-cli2 0.15.0 while this repo
#   pins 0.23.2, so a PR could be green locally and red in CI (or the reverse)
# - markdownlint-cli2 requires Node >= 22 (its `engines` field) and `bun lint:md` shells out
#   to node via the bin shebang, so the Node version is pinned explicitly rather than
#   inherited from whatever the runner image happens to ship
# - hard-fails the job on any violation (heading hierarchy, fence/list spacing, empty links, etc.)

name: markdownlint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main # catches drift landing on main (e.g. merges that bypassed a PR run)

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default-deny at the workflow level; grant only what each job needs at the job level.
permissions: {}

# Cancel superseded in-progress runs on the same PR (force-push / rapid commits) so stale
# runs stop burning runner minutes. cancel-in-progress is scoped to pull_request events so
# post-merge runs on main and manual workflow_dispatch runs always complete and keep their signal.
concurrency:
  group: markdownlint-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint all markdown files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # required to fetch repository contents
    steps:
      # Step 1: Checkout. No fetch-depth: 0 needed — the whole repo is linted, nothing is diffed.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Step 2: Node 22+ is required by markdownlint-cli2; see header note.
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      # Step 3: Bun runs the package.json script and installs the pinned linter.
      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Step 4: Lint the whole repo with the repo's own pinned markdownlint-cli2.
      - name: Run markdownlint
        run: bun lint:md
