# Format and Lint (EXSC-1296)
# - Enforces in CI what the pre-commit hook (lint-staged) enforces locally, so commits made
#   with --no-verify, from a machine without hooks, through the GitHub UI, or from a branch cut
#   before a formatter change cannot land unformatted or with solhint errors
# - Checks the whole tree, not only the PR's changed files: it runs in about 20 s and also
#   catches drift a stale-base merge brings in
# - Check-only: every step reads, none writes. Fix locally with `bun format:fix` / `bun lint:sol:fix`
# - Each tool is its own step that runs after an earlier tool failed, so one run reports every
#   failing tool (`bun format` chains them with && and stops at the first failure). The tools
#   are skipped when their install step failed, so a broken install reads as one failure
#   rather than four
# - solhint errors fail the job; warnings do not
# - A formatter/linter version bump that changes output (oxfmt, prettier-plugin-solidity,
#   solhint, .foundry-version) must carry the `bun format:fix` result in the same PR
# - oxlint runs in validateScripts.yml, which generates the TypeChain types it needs
# - Known limitation: `format-and-solhint` is not yet a required status check on `main`

name: format-and-lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main # catches drift landing on main (e.g. merges that bypassed a PR run)

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

# Cancel superseded in-progress PR runs; post-merge and manual runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-and-solhint:
    name: format-and-solhint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required to fetch repository contents
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      # forge fmt only; no submodules or build needed (foundry.toml [fmt] ignores src/ and lib/)
      - name: Install Foundry
        id: foundry
        uses: ./.github/actions/setup-foundry
        with:
          build-cache: "false"

      - name: Prettier (src/ and archive/ Solidity)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx prettier --check "{src,archive}/**/*.sol"

      - name: oxfmt (TS/JS)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx oxfmt --check

      - name: forge fmt (test/ and script/ Solidity)
        if: ${{ !cancelled() && steps.foundry.outcome == 'success' }}
        run: forge fmt --check

      - name: solhint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun lint:sol
