# Intent Factory Review Check
# - Fails a PR that changes AttestedBridgeFacet, a bridge facet it dispatches, or code that shapes
#   their calldata, until the IntentFactoryReviewed label is set
# - Why: Intent Factory's BridgeCommitmentLedger trusts what its facts adapters decode from the
#   calldata these facets execute, so a change here can make an adapter describe a call that no
#   longer happens. The Intent Factory team reviews, then anyone adds the label
# - A push to the PR removes the label, so every new head needs a fresh review
# - Runs on PR open/sync/reopen and on label changes; reads only the event payload, no checkout

name: Intent Factory Review Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/Facets/AttestedBridgeFacet.sol'
      - 'src/Facets/AcrossFacetV4.sol'
      - 'src/Facets/PolymerCCTPFacet.sol'
      - 'src/Facets/LiFiIntentEscrowFacetV2.sol'
      - 'src/Interfaces/IAttester.sol'
      - 'src/Interfaces/ILiFi.sol'
      - 'src/Libraries/LibAttestableSelectors.sol'
      - 'src/Libraries/LibPeripheryRegistry.sol'
      - 'src/Libraries/LibSwap.sol'
      - 'src/Helpers/SwapperV2.sol'

permissions: {}

jobs:
  intent-factory-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # required to remove the IntentFactoryReviewed label on a new push
    env:
      LABEL: IntentFactoryReviewed
      REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'IntentFactoryReviewed') }}
    steps:
      - name: Remove the IntentFactoryReviewed label after a push
        if: github.event.action == 'synchronize' && env.REVIEWED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$LABEL" >/dev/null
          echo -e "\033[31mNew commits were pushed after the Intent Factory review,\033[0m"
          echo -e "\033[31mso the $LABEL label was removed.\033[0m"
          echo -e "\033[31mGet the new commits reviewed, then add the label again.\033[0m"
          exit 1

      - name: Require the IntentFactoryReviewed label
        shell: bash
        run: |
          if [[ "$REVIEWED" != "true" ]]; then
            echo -e "\033[31mThis PR changes AttestedBridgeFacet, a facet it dispatches,\033[0m"
            echo -e "\033[31mor code shaping their calldata, which Intent Factory decodes.\033[0m"
            echo -e "\033[31mGet their review, then add the $LABEL label.\033[0m"
            exit 1
          fi
          echo -e "\033[32m$LABEL label present.\033[0m"
