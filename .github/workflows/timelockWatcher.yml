# Timelock Watcher (report-only)
# - Re-checks every pending operation on every production LiFiTimelockController and alerts
#   Slack when one is wrong or cannot be verified. It never cancels, executes or signs, and
#   holds no private key.
# - Triggers: every 10 minutes (cron) and manual workflow_dispatch
# - Key behaviors:
#     * Scheduled runs are on unless the repo variable ENABLE_TIMELOCK_WATCHER is "false"
#     * Operations are found on chain from CallScheduled/CallSalt logs, not from the execution
#       queue, so a schedule made by any route is seen; the queue is only a cross-check
#     * Per operation: op-id recompute, schedule state, delay against config/timelockController.json,
#       targets known to main (gate E), delegatecall-shaped payloads, storage authorities (gate G,
#       the pre-broadcast gate) and, for an operation that installs code, deployed bytecode against
#       a rebuild of its recorded commit (gate K). Verdict ok / mismatch / unverified, with the
#       cancel matrix's recommendation shown for information only
#     * Timelock addresses come from deployments/<network>.json at origin/main: a reviewed file,
#       cross-checked on chain against LiFiDiamond.owner()
#     * Scan cursors, gate K results and alert records carry between runs in the Actions cache
#       (timelock-watcher-state-*). Losing it re-scans history and re-sends standing alerts;
#       it can never hide one
#     * Slack: SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS, on a mismatch, a new unverified
#       finding and a change of verdict; a standing mismatch repeats every 6 hours, a standing
#       unverified finding every 24 hours
#     * The job fails when a network could not be read, an operation mismatches, or an alert
#       could not be delivered
# - Required repo configuration:
#     * vars.ENABLE_TIMELOCK_WATCHER (optional; "false" pauses scheduled runs)
#     * secrets.MONGODB_URI (non-sensitive cluster: RPC endpoints, the execution queue, sign-time
#         records and deployment records for gate K)
#     * secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS
# - Known limitations:
#     * Tron is reported as not covered on every run
#     * History is backfilled from each timelock's creation block for 2 minutes per network per run;
#       a network whose endpoints only serve narrow log ranges reports "history not scanned yet"
#       (unverified) until it completes. Dispatch with a larger history-minutes to catch up faster
#     * Gate J (RPC quorum) is not run; gate K reads code through its own quorum fallback

name: Timelock Watcher

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:
    inputs:
      history-minutes:
        description: Minutes per network for the history backfill (keep under 15 to fit the job timeout)
        required: false
        default: '2'

# Default-deny at the workflow level; grant only what the job needs at the job level.
permissions: {}

# Runs must not overlap: each one reads and then saves the state the next one starts from.
concurrency:
  group: timelock-watcher
  cancel-in-progress: false

jobs:
  watch-timelocks:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_TIMELOCK_WATCHER != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # required to checkout the repository
      actions: read # required to resolve this job's URL (jobs API) for the Slack deep-link

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Gate K checks out each recorded deployment commit to rebuild it.
          fetch-depth: 0
          persist-credentials: false # no git writes needed; avoid leaving GITHUB_TOKEN in .git/config

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - name: Install the compilers gate K rebuilds with
        # Gate K builds with --offline, so a solc version foundry.toml pins but the runner lacks
        # would make every rebuild unverifiable. A rebuild needing any other version still reports
        # that as its unverified reason.
        run: |
          work="$(mktemp -d)"
          mkdir -p "$work/src"
          echo 'pragma solidity >=0.8.0; contract Probe {}' > "$work/src/Probe.sol"
          for version in $(grep -E "^solc_version *= *'" foundry.toml | sed -E "s/.*'([0-9.]+)'.*/\1/" | sort -u); do
            forge build --root "$work" --use "$version" > /dev/null
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Fetch RPC endpoints from MongoDB
        uses: ./.github/actions/fetch-rpcs
        with:
          mongodb-uri: ${{ secrets.MONGODB_URI }}

      - name: Restore watcher state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: timelock-watcher-state.json
          # Never an exact hit: every run saves under its own key, and the newest prefix match
          # is the previous run's state.
          key: timelock-watcher-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            timelock-watcher-state-

      - name: Watch timelocks
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS: ${{ secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS }}
          HISTORY_MINUTES: ${{ inputs.history-minutes || '2' }}
          GH_TOKEN: ${{ github.token }} # required by `gh api` to resolve the job's html_url
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: ${{ github.job }}
          RUN_OVERVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ##### Deep-link the Slack alert to this job; fall back to the run overview.
          RESOLVED_URL=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq "[.jobs[] | select(.name == \"${JOB_NAME}\") | .html_url][0] // .jobs[0].html_url" 2>/dev/null || true)
          export TIMELOCK_WATCHER_RUN_URL="${RESOLVED_URL:-$RUN_OVERVIEW_URL}"

          set -o pipefail
          bunx tsx ./script/deploy/safe/timelock-watcher.ts \
            --stateFile timelock-watcher-state.json \
            --historyMinutes "$HISTORY_MINUTES" \
            2>&1 | tee watcher.log

      - name: Save watcher state
        # Saved on failure too: a run that read ten networks and lost one keeps the progress it made.
        if: always() && hashFiles('timelock-watcher-state.json') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: timelock-watcher-state.json
          key: timelock-watcher-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Notify Slack if the watcher crashed
        # The watcher alerts on its own findings. This covers a run that died before it could.
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_DEV_SC_GITHUB_CI_NOTIFICATIONS }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f watcher.log ] && grep -q "^.*Checked [0-9]* of [0-9]* network" watcher.log; then
            echo "The watcher finished and reported its own findings; no crash notice."
            exit 0
          fi
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo -e "\033[31m::error::The watcher crashed and no Slack webhook is configured\033[0m"
            exit 1
          fi
          PAYLOAD=$(jq -n --arg url "$WORKFLOW_URL" \
            '{text: ("❌ Timelock watcher crashed before reporting; no pending operation was checked this run. <" + $url + "|Logs>")}')
          curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" > /dev/null \
            || echo -e "\033[33m⚠️ Failed to send the crash notice\033[0m"

      # Download with: `gh run download <run-id> -n timelock-watcher-logs`
      - name: Upload watcher log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timelock-watcher-logs
          path: |
            watcher.log
            timelock-watcher-state.json
          retention-days: 7
