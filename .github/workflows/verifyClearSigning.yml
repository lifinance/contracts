# Verify Clear-Signing Proposal is Current
# - Purpose: block PRs that change facets / the generator / the proposal JSON without keeping `config/clearSigningProposal.json` in sync with the generator's output. Also blocks PRs that introduce a user-facing function the generator can't template.
# - Triggers: pull_request on src/Facets/**, src/Libraries/** (the structs the templates resolve paths into), tasks/buildClearSigningProposal.ts, tasks/generateClearSigningTests.ts, config/clearSigningProposal.json, config/clearSigningTests.json, the workflow itself,
#   and the shared foundry setup action + .foundry-version its toolchain comes from
# - Key behaviors: builds forge artifacts, runs `tasks/buildClearSigningProposal.ts` (strict-by-default; exits non-zero on unrecognized or shape-mismatched functions), then `git diff --exit-code` on the committed JSON
# - Failure modes (and remedy):
#     - Generator exited non-zero: a user-facing function doesn't match a template. Either align the facet's struct shape with LiFi.BridgeData / LibSwap.SwapData, or extend the generator (`tasks/buildClearSigningProposal.ts`) to handle the new shape.
#     - Diff non-empty: `config/clearSigningProposal.json` is stale relative to the generator's current output. Run `bunx tsx tasks/buildClearSigningProposal.ts` locally and commit the result.
#     - "N format(s) have no reviewed test case": a format has no case in `config/clearSigningTests.json`, which the sync generates the registry fixture from. Run the render loop in docs/ClearSigningProposal.md ("Test fixtures") and commit the result. Caught here rather than in the sync, where the failure is after merge and unattended.
# - Note: this workflow is the human-in-the-loop. The auto-sync workflow (`syncLedgerClearSigning.yml`) trusts that this gate has passed before main.

name: Verify Clear-Signing Proposal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/Facets/**'
      # LiFi.BridgeData / LibSwap.SwapData live here and every template resolves
      # its field paths into them, so a struct change can invalidate the proposal
      # without touching a facet.
      - 'src/Libraries/**'
      - 'tasks/buildClearSigningProposal.ts'
      - 'tasks/generateClearSigningTests.ts'
      - 'config/clearSigningProposal.json'
      # The reviewed testsv2 fixture. The PR that commits it is the documented
      # remedy for an uncovered format, so it has to run this gate itself.
      - 'config/clearSigningTests.json'
      - '.github/workflows/verifyClearSigning.yml'
      - '.github/actions/setup-foundry/**'
      - '.foundry-version'

permissions:
  contents: read # required to fetch repository contents

jobs:
  verify-clear-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: recursive
          persist-credentials: false # gate does not need repo auth on the runner

      - name: Set up Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - name: Build contracts (generate Foundry artifacts)
        run: forge build --skip script --skip test --skip Base --skip Test --skip '*.t.sol'

      - name: Run clear-signing generator (strict mode)
        # `tasks/buildClearSigningProposal.ts` exits non-zero on any user-facing
        # function it can't confidently template (unrecognized prefix, struct
        # shape mismatch, swapTokens variant without a hardcoded template).
        # That failure is the "you added a facet without a clear-signing plan"
        # signal — the PR cannot merge until either the facet's struct matches
        # the canonical shape or the generator is extended to handle the new
        # shape.
        run: bunx tsx tasks/buildClearSigningProposal.ts

      - name: Verify every format has a test case that asserts something
        # Two invariants, both of which otherwise fail after merge rather than here:
        #   - a case whose displayed field renders 0x0 passes every runner while
        #     asserting nothing, so a new format whose displayed component the
        #     generator has no value for must fail this PR;
        #   - the sync builds the registry fixture from config/clearSigningTests.json
        #     and refuses to invent an expectation, so a format with no reviewed
        #     case there kills the next push-to-main sync — a workflow whose
        #     failure nobody is watching for.
        run: bunx tsx tasks/generateClearSigningTests.ts --descriptor config/clearSigningProposal.json --check --tests config/clearSigningTests.json

      - name: Verify config/clearSigningProposal.json is up-to-date
        # The generator just wrote a fresh proposal. If it differs from the
        # committed copy, the PR forgot to regenerate after a relevant change.
        # `--exit-code` makes `git diff` return non-zero on any diff; the
        # explicit verbose diff in the error path gives the dev a copy-pasteable
        # remedy.
        run: |
          if ! git diff --exit-code config/clearSigningProposal.json; then
            echo -e "\n\033[31m❌ config/clearSigningProposal.json is stale.\033[0m"
            echo -e "\033[33mRun this locally and commit the result:\033[0m"
            echo "  bunx tsx tasks/buildClearSigningProposal.ts"
            echo "  git add config/clearSigningProposal.json"
            exit 1
          fi
          echo -e "\033[32m✓ proposal is current\033[0m"

      - name: Verify every display.formats entry has renderable fields
        # A format with no `fields` renders only a title in the wallet (no amount,
        # receiver or destination), which the ERC-7730 registry rejects. Guard the
        # source of truth so we never author one; the sync generator additionally
        # scrubs the `*Packed` / `*Min` residue earlier syncs pushed to the registry.
        run: |
          set -euo pipefail
          empty=$(jq -r '.formats | to_entries[] | select((.value.fields // []) | length == 0) | .key' config/clearSigningProposal.json)
          if [ -n "$empty" ]; then
            echo -e "\n\033[31m❌ These display.formats entries have no fields:\033[0m"
            echo "$empty"
            echo -e "\033[33mEvery format must render at least one field. Fix its template in tasks/buildClearSigningProposal.ts or exclude the function.\033[0m"
            exit 1
          fi
          echo -e "\033[32m✓ all display.formats entries have fields\033[0m"
