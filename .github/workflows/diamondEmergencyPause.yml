# EMERGENCY >> Pause all PROD diamonds
#
# - Manually-triggered (workflow_dispatch) production break-glass: pauses EVERY production
#   LiFiDiamond (all non-testnet EVM + Tron networks) resolved from config/networks.json +
#   deployments/<net>.json, directly from the registered PauserWallet EOA.
# - Runs the frozen, self-contained script/emergency/emergencyPauseBreakGlass.sh, which pauses
#   DIRECTLY from the PauserWallet (EVM via cast, Tron via troncast) — never via a Safe proposal,
#   and intentionally independent of universalCast/helperFunctions so routing churn cannot break it.
# - Authorization: requires typing 'UNDERSTOOD' AND membership of the lifinance/DiamondPauser team.
# - Slack: posts a status (success/failure) with a GH run link and the runbook URL
#   (EMERGENCY_PAUSE_RUNBOOK_URL repository variable) to the SC-general channel on every run.
# - Known limitations: needs RPCs (MongoDB) + production deploy logs + the PRIV_KEY_PAUSER_WALLET secret.

name: EMERGENCY >> Pause all PROD diamonds

on:
  workflow_dispatch:
    inputs:
      warning:
        description: "By clicking the next button you are pausing all PRODUCTION diamonds. Please proceed with extreme caution !!! You must type 'UNDERSTOOD' to proceed"
        required: true

permissions:
  contents: read # required to fetch repository contents
  actions: read # required to resolve the current job ID for the Slack deep-link

jobs:
  diamond-emergency-pause-production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dev dependencies
        run: bun install

      - name: Check input
        if: ${{ inputs.warning != 'UNDERSTOOD' }}
        run: |
          echo -e "\033[31mYou must type 'UNDERSTOOD' to proceed. Please try again. \033[0m"
          exit 1

      # DiamondPauser team-membership gate. triggering_actor (not actor) so that a re-run by a
      # non-member of a member's run is rejected. Passes only on HTTP 200 with state "active".
      - name: Check DiamondPauser team membership
        if: ${{ inputs.warning == 'UNDERSTOOD' }}
        env:
          GH_TOKEN: ${{ secrets.GIT_ACTIONS_BOT_PAT_CLASSIC }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          MEMBERS_URL="https://github.com/orgs/lifinance/teams/diamondpauser/members"
          RESPONSE_FILE=$(mktemp)

          # --globoff: bot logins such as "name[bot]" must not be read as curl URL globs
          CURL_EXIT=0
          HTTP_STATUS=$(curl -sS --globoff --connect-timeout 10 --max-time 30 \
            -o "$RESPONSE_FILE" \
            -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/lifinance/teams/diamondpauser/memberships/$ACTOR") || CURL_EXIT=$?
          MEMBERSHIP_STATE=$(jq -r '.state // empty' "$RESPONSE_FILE" 2>/dev/null || true)

          function failGate() {
            echo -e "\033[31m$1\033[0m"
            echo "HTTP status: ${HTTP_STATUS:-none}"
            echo "Response body:"
            cat "$RESPONSE_FILE"
            echo ""
            echo "Ask one of the DiamondPauser team members to execute this action: $MEMBERS_URL"
            exit 1
          }

          if [[ "$CURL_EXIT" != "0" ]]; then
            failGate "Could not check DiamondPauser membership for $ACTOR: network error (curl exit $CURL_EXIT)"
          elif [[ "$HTTP_STATUS" == "200" && "$MEMBERSHIP_STATE" == "active" ]]; then
            echo -e "\033[32mUser $ACTOR is an active member of the DiamondPauser team and may execute this action\033[0m"
          elif [[ "$HTTP_STATUS" == "200" && "$MEMBERSHIP_STATE" == "pending" ]]; then
            failGate "User $ACTOR has a pending invite to diamondpauser; it must be accepted first"
          elif [[ "$HTTP_STATUS" == "404" ]]; then
            failGate "User $ACTOR is not a member of diamondpauser (or the PAT cannot see the team)"
          elif [[ "$HTTP_STATUS" == "401" || "$HTTP_STATUS" == "403" ]]; then
            failGate "Could not check DiamondPauser membership for $ACTOR: the PAT was rejected (HTTP $HTTP_STATUS)"
          else
            failGate "Could not confirm active DiamondPauser membership for $ACTOR (HTTP $HTTP_STATUS, state '${MEMBERSHIP_STATE}')"
          fi

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - name: Fetch RPC endpoints from MongoDB
        uses: ./.github/actions/fetch-rpcs
        with:
          mongodb-uri: ${{ secrets.MONGODB_URI }}

      - name: Pause Diamond
        # Frozen, self-contained break-glass script (script/emergency/) — intentionally
        # independent of universalCast/helperFunctions so routing churn cannot break the pause.
        run: bash script/emergency/emergencyPauseBreakGlass.sh
        env:
          ENVIRONMENT: production
          PRIVATE_KEY_PAUSER_WALLET: ${{ secrets.PRIV_KEY_PAUSER_WALLET }}

      # Resolve a deep-link to the current job's log view so the Slack message
      # lets on-call open logs in one click. Falls back to the run-level URL if
      # the API call fails so the notification still contains a usable link.
      - name: Resolve current job URL
        if: ${{ always() }}
        id: jobinfo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          job_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq ".jobs[] | select(.name == \"${{ github.job }}\") | .id" 2>/dev/null || true)
          if [[ -n "${job_id}" ]]; then
            url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${job_id}"
          else
            url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack of pause execution
        # always() so the alert fires even when the pause script exits non-zero
        # (per-network isolation can partially succeed and still return 1).
        if: ${{ always() }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_SC_GENERAL }}
          webhook-type: incoming-webhook
          # JSON payload so the inline ternary for status emoji interpolates cleanly. \n produces
          # line breaks. Runbook URL from the EMERGENCY_PAUSE_RUNBOOK_URL repository variable
          # when unset the message says so rather than rendering a broken link.
          payload: |
            {
              "text": "ATTENTION - the PRODUCTION emergency diamond pause action was just executed across all production diamonds by ${{ github.actor }}\nStatus: ${{ job.status == 'success' && 'Success ✅' || 'Failed ❌' }}\nGH run: ${{ steps.jobinfo.outputs.url }}\nRunbook: ${{ vars.EMERGENCY_PAUSE_RUNBOOK_URL || 'not configured — set the EMERGENCY_PAUSE_RUNBOOK_URL repository variable' }}"
            }
